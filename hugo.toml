baseURL = "https://solobrief.co"
locale = "en-us"
title = "SoloBrief"
theme = "PaperMod"
paginate = 10
googleAnalytics = "G-QRQV8QDSRG"
enableRobotsTXT = true
buildDrafts = false
buildFuture = false
buildExpired = false

[params]
  author = "SoloBrief"
  description = "Honest AI tool reviews for freelancers and solopreneurs. No hype, just tools that actually work."
  defaultTheme = "light"
  disableThemeToggle = true
  # Homepage feed: surface reviews, comparisons, and guides (not just the largest section).
  mainSections = ["reviews", "comparisons", "posts"]
  ShowShareButtons = false
  ShowReadingTime = true
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = false
  ShowFullTextinRSS = false
  ShowToc = true
  TocOpen = false
  env = "production"

  # Brand tagline, used in home page header
  [params.homeInfoParams]
    Title = "AI tools that actually work for freelancers."
    Content = "Honest reviews, real pricing, and clear verdicts. So you don't waste money on tools that don't deliver."

  # Social links
  [[params.socialIcons]]
    name = "pinterest"
    url = "https://pinterest.com/solobrief"

  [[params.socialIcons]]
    name = "twitter"
    url = "https://twitter.com/solobrief"

  [[params.socialIcons]]
    name = "instagram"
    url = "https://instagram.com/solobrief"

  [[params.socialIcons]]
    name = "reddit"
    url = "https://reddit.com/u/solobrief"

  # Cover image defaults
  [params.cover]
    hidden = false
    hiddenInList = false
    hiddenInSingle = false

  # Schema / SEO
  [params.schema]
    publisherType = "Organization"
    publisherLogo = "/images/solobrief-icon.svg"

  [params.assets]
    favicon = "/images/solobrief-icon.svg"

[params.footer]
  text = '<a href="/privacy/">Privacy Policy</a> · <a href="/terms/">Terms of Service</a> · <a href="/disclosure/">Affiliate Disclosure</a> · <a href="/contact/">Contact</a>'

[menu]
  [[menu.main]]
    identifier = "reviews"
    name = "Reviews"
    url = "/reviews/"
    weight = 10
  [[menu.main]]
    identifier = "comparisons"
    name = "Comparisons"
    url = "/comparisons/"
    weight = 20
  [[menu.main]]
    identifier = "posts"
    name = "Guides"
    url = "/posts/"
    weight = 30
  [[menu.main]]
    identifier = "about"
    name = "About"
    url = "/about/"
    weight = 40
  [[menu.main]]
    identifier = "toolkit"
    name = "Toolkit"
    url = "/go/freelancer-ai-toolkit/"
    weight = 50

# CRAWL BUDGET, part 2. Added 2026-08-04 after a GSC export showed Google had
# crawled 14 RSS feeds and reported every one as "Crawled - currently not indexed".
# Hugo generated 25 index.xml feeds, 21 of them for individual tags and categories.
# They were never in the sitemap; Google discovered them through the rel="alternate"
# link Hugo puts in every page head, so the earlier sitemap fix did not touch them.
# An RSS feed for a tag with two posts is not something anyone subscribes to, and on a
# site with zero inbound links every crawl spent on one is a crawl not spent on an
# article. Feeds now exist only for the home page and the real sections.
[outputs]
  home = ["HTML", "RSS", "JSON"]
  section = ["HTML", "RSS"]
  taxonomy = ["HTML"]
  term = ["HTML"]

[taxonomies]
  category = "categories"
  tag = "tags"

[markup.goldmark.renderer]
  unsafe = true

[markup.highlight]
  codeFences = true
  guessSyntax = true
  style = "friendly"

# Related posts -3 articles at end of each post for internal link flow
[related]
  threshold = 80
  includeNewer = true
  toLower = false
  [[related.indices]]
    name = "categories"
    weight = 100
  [[related.indices]]
    name = "tags"
    weight = 60

# Minify for performance
[minify]
  disableCSS = false
  disableHTML = false
  disableJS = false

[sitemap]
  changefreq = "weekly"
  priority = 0.5

# Homepage gets highest priority; articles override to 0.8 in frontmatter
# Utility pages (about, contact, legal) inherit the 0.5 default

# CRAWL BUDGET, added 2026-08-04 after the site SEO audit.
# The audit found 20 of 40 sitemap URLs were thin /tags/ and /categories/ list pages
# (154 words each, against 2,426 for a real article), all index,follow, while TWO real
# money pages had never been crawled at all despite months in the sitemap. On a site
# with zero inbound links, crawl budget is the scarce resource and it was being spent
# on taxonomy. These pages stay for navigation and for the related-posts feature; they
# just stop competing for crawl and stop being indexed.
[[cascade]]
  [cascade.params]
    robotsNoIndex = true
  [cascade.target]
    kind = "{term,taxonomy}"
